<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#020609">
    <meta name="color-scheme" content="dark">
    <title>云蝶科技</title>
    <link rel="preload" href="./yundie.webp" as="image" type="image/webp">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <div class="screen" id="screen">
      <canvas id="energy-canvas" aria-hidden="true"></canvas>

      <div class="atmosphere" aria-hidden="true">
        <span class="mist mist-left"></span>
        <span class="mist mist-right"></span>
      </div>

      <div class="top-mark" aria-hidden="true">
        <span></span>
        <i></i>
      </div>

      <section class="mission-status" id="mission-status" aria-live="polite">
        <div class="mission-kicker" id="mission-kicker">机器人任务状态</div>
        <div class="mission-title" id="mission-title">等待任务</div>
        <div class="mission-detail" id="mission-detail">任务系统连接中</div>
      </section>

      <button
        class="fullscreen-toggle"
        id="fullscreen-toggle"
        type="button"
        aria-label="进入全屏"
      >
        <span class="fullscreen-icon" aria-hidden="true">⛶</span>
        <span class="fullscreen-label">全屏</span>
      </button>

      <main class="brand-stage" aria-label="云蝶科技 Logo">
        <div class="orbit orbit-outer" aria-hidden="true"></div>
        <div class="orbit orbit-inner" aria-hidden="true"></div>
        <div class="wing-light wing-light-left" aria-hidden="true"></div>
        <div class="wing-light wing-light-right" aria-hidden="true"></div>

        <div class="logo-stack">
          <img class="logo-piece logo-text" src="./yundie.webp" alt="">
          <img class="logo-piece logo-wing wing-left" src="./yundie.webp" alt="">
          <img class="logo-piece logo-wing wing-right" src="./yundie.webp" alt="">
        </div>
      </main>

      <footer class="signal-footer" aria-hidden="true">
        <span class="signal-dot"></span>
        <span class="signal-line line-short"></span>
        <span class="signal-line"></span>
        <span class="signal-line line-long"></span>
        <span class="signal-dot signal-dot-soft"></span>
      </footer>

      <div class="corner corner-tl" aria-hidden="true"></div>
      <div class="corner corner-tr" aria-hidden="true"></div>
      <div class="corner corner-bl" aria-hidden="true"></div>
      <div class="corner corner-br" aria-hidden="true"></div>
    </div>

    <script src="./app.js" defer></script>
  </body>
</html>
