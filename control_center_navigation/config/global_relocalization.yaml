cartographer_global_relocalization:
  ros__parameters:
    use_sim_time: false
    auto_start: true
    publish_initial_pose: true

    map_topic: /map
    scan_topic: /topic_gv_front_lidar_0_307
    rear_scan_topic: /topic_gv_rear_lidar_0_307
    use_rear_scan: true
    require_rear_scan: true
    scan_pair_max_age_sec: 0.10
    scan_max_age_sec: 0.60
    # Use trustworthy sub-20cm returns as auxiliary geometry, not a stop condition.
    near_wall_matching: true
    # Extra verification only when the original score margin is inconclusive.
    supplemental_verification: true
    supplemental_margin: 0.06
    maximum_wall_conflict: 0.15
    odom_frame: odom
    # Localization scoring only. Raw obstacle / Nav2 observations are unchanged.
    minimum_matched_ratio: 0.35
    minimum_structural_ratio: 0.15
    minimum_matched_sectors: 3
    minimum_normal_diversity: 0.06
    occluded_point_weight: 0.45
    candidate_region_m: 1.0
    initialpose_topic: /initialpose
    result_pose_topic: /global_relocalization/result_pose
    status_topic: /global_relocalization/status
    base_frame: base_link
    map_frame: map

    occupied_threshold: 65
    free_threshold: 25
    min_scan_points: 60
    coarse_scan_points: 90
    fine_scan_points: 240
    top_candidates: 40

    min_range: 0.20
    max_range: 15.0
    coarse_linear_step: 0.25
    coarse_angular_step_deg: 5.0
    fine_linear_window: 0.35
    fine_linear_step: 0.05
    fine_angular_window_deg: 6.0
    fine_angular_step_deg: 1.0

    likelihood_sigma: 0.12
    max_obstacle_distance: 0.75
    robot_clearance: 0.20
    min_score: 0.52
    min_score_margin: 0.03
    required_consistent_matches: 3
    consistency_position_tolerance: 0.25
    consistency_yaw_tolerance_deg: 5.0
    retry_interval_sec: 1.0
    max_attempts: 20

    transform_timeout_sec: 0.30
    covariance_x: 0.25
    covariance_y: 0.25
    covariance_yaw: 0.20
    publish_repetitions: 3

    diagnostic_reference_enabled: false
