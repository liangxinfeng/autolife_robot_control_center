/**:
  ros__parameters:
    filter1:
      name: chassis_interior_only
      type: laser_filters/LaserScanPolygonFilter
      params:
        polygon_frame: base_link
        # Strictly INSIDE the 50cm body, not the padded collision footprint.
        # Removed self hits become NaN (not infinity/free-space clearing rays).
        polygon: '[[-0.18, -0.16], [0.18, -0.16], [0.18, 0.16], [-0.18, 0.16]]'
        invert: false
        footprint_topic: unused_static_chassis_polygon
    filter2:
      name: weak_wall_end_tail
      type: control_center_navigation/WeakWallTailFilter
      params:
        # No broad intensity cutoff. Only short weak, inward-bending wall ends.
        # NaN means unobserved, never a free-space clearing ray.
        enabled: true
