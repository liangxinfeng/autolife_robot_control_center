docking_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 30.0
    initial_perception_timeout: 3.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 25.0
    undock_linear_tolerance: 0.04
    undock_angular_tolerance: 0.05
    max_retries: 0
    base_frame: base_link
    fixed_frame: odom
    odom_topic: /odom
    dock_backwards: true
    dock_prestaging_tolerance: 0.1
    enable_stamped_cmd_vel: false
    controller:
      k_phi: 3.0
      k_delta: 2.0
      beta: 0.5
      lambda: 2.0
      v_linear_min: 0.025
      v_linear_max: 0.07
      v_angular_max: 0.12
      slowdown_radius: 0.32
      use_collision_detection: true
      costmap_topic: /local_costmap/costmap_raw
      footprint_topic: /local_costmap/published_footprint
      transform_tolerance: 0.2
      projection_time: 1.0
      simulation_time_step: 0.1
      dock_collision_threshold: 0.42
    dock_plugins:
    - fine_charging_dock
    fine_charging_dock:
      plugin: opennav_docking::SimpleChargingDock
      use_external_detection_pose: false
      use_battery_status: true
      charging_threshold: 0.1
      use_stall_detection: false
      docking_threshold: 0.001
      staging_x_offset: -0.35
      staging_yaw_offset: 3.141592653589793
cmd_vel_arbiter:
  ros__parameters:
    straight_docking_enabled: true
    docking_status_topic: /waypoints/navigation_status
    straight_docking_min_speed: 0.0
    straight_docking_stop_distance: 0.0
    straight_docking_status_timeout_sec: 1.2
    straight_docking_progress_stop_enabled: true
    straight_docking_progress_timeout_sec: 4.0
    straight_docking_min_progress: 0.015
    charger_waypoint_name: 充电桩
    staging_approach_slowdown_enabled: true
    staging_approach_slow_distance: 0.9
    staging_approach_max_linear_speed: 0.12
    staging_approach_max_angular_speed: 0.18
    staging_final_heading_distance: 0.25
    staging_final_max_linear_speed: 0.05
    staging_final_max_angular_speed: 0.1
    battery_topic: /topic_gv_battery_0_307
    charging_current_threshold: 0.1
    charging_use_current: false
    charging_confirm_samples: 1
    charging_stop_hold_sec: 8.0
    charging_stop_publish_hz: 20.0
