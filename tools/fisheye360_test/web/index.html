<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>345 鱼眼相机设置 · 泊车视图</title>
<link rel="icon" href="data:,">
<style>
:root{color-scheme:dark;font:16px system-ui,sans-serif;background:#090f17;color:#eaf0f7;--border:#304052;--accent:#8fdfd0}
*{box-sizing:border-box}body{margin:0}main{max-width:1680px;margin:auto;padding:16px clamp(12px,2.2vw,34px)}
header,.tools,.tabs,.foot,.card-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header,.card-head{justify-content:space-between}h1{font-size:clamp(22px,2.7vw,34px);margin:0;letter-spacing:.03em}
.kicker,.foot,.hint{color:#9baec2;font-size:13px}.kicker{margin-bottom:2px}.pill{border:1px solid var(--border);padding:4px 9px;border-radius:6px;color:#adbecd;font-size:12px}
.tabs{margin:14px 0}button,select{cursor:pointer;background:#172332;color:#eff6ff;border:1px solid var(--border);padding:8px 12px;border-radius:7px;font:inherit;font-size:14px}
button[aria-pressed=true]{background:#163837;border-color:#60b1a2;color:#c9fff5}button:focus-visible,select:focus-visible{outline:2px solid var(--accent)}
.board{position:relative;display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px;align-items:center}
.board[data-mode=map]{grid-template-columns:minmax(0,1fr)}.board[data-mode=raw]{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{width:100%;min-width:0;margin:0}.map-card{width:min(100%,max(210px,calc((100dvh - 204px)*.75)));justify-self:center}
.card-head{font-size:14px;color:#dcebf6;margin-bottom:6px;min-height:25px}
.frame{position:relative;width:100%;aspect-ratio:8/5;overflow:hidden;border-radius:10px;background:#111d29;outline:1px solid var(--border)}
.map-model-note{color:#a9bacc;font-size:11px;font-weight:500}.map-card .frame{aspect-ratio:3/4}.raw-card .frame{aspect-ratio:16/9}
.layer{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}.frame .layer{overflow:visible}
#surface{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.badge{position:absolute;top:10px;left:10px;z-index:2;background:#101b28e8;border:1px solid var(--border);padding:4px 8px;border-radius:6px;font-size:12px;color:#f3f6fa;pointer-events:none}
.badge.bottom{top:auto;bottom:10px}.foot{justify-content:space-between;margin-top:10px;line-height:1.45}
.swatch{display:inline-block;width:15px;height:11px;margin-right:5px;vertical-align:-1px;border:1px solid #65758a;background:repeating-linear-gradient(135deg,#111c29 0 4px,#38475b 4px 6px)}
.status{font:12px ui-monospace,monospace;color:#abdacf}.status[data-state=offline]{color:#f4ba91}
#calibration{margin:14px 0;padding:12px;background:#101b28;border:1px solid var(--border);border-radius:8px}
#fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-top:12px}#fields label{font-size:12px;color:#c1cfdd}
#fields input[type=range]{width:100%;accent-color:#8fdfd0;margin:5px 0}#fields output{float:right;color:var(--accent)}
#error{color:#ffb096;font-size:14px} [hidden]{display:none!important}
@media(max-width:790px){.board{grid-template-columns:1fr}.map-card{width:min(100%,390px)}.board[data-mode=raw]{grid-template-columns:1fr}.frame{border-radius:6px}}
</style>
</head>
<body>
<main>
  <header>
    <div><div class="kicker">345 · 前后鱼眼 · 视觉测试</div><h1>泊车视图</h1></div>
    <div class="tools"><span class="pill">仅相机 · 无运动控制</span><button id="toggle-cal" aria-expanded="false" aria-controls="calibration">标定参数</button></div>
  </header>
  <div class="tabs" id="modes" aria-label="画面模式">
    <button data-mode="parking">后视＋俯视</button><button data-mode="map">俯视</button><button data-mode="raw">原始双路</button>
  </div>
  <section id="calibration" hidden>
    <div class="tools"><label>相机 <select id="cam-cal"><option value="front">前</option><option value="rear">后</option></select></label><button id="reset">恢复 345 默认值</button><button id="sync-vr" type="button">参数同步到 VR</button><span id="sync-state" class="hint" role="status"></span></div>
    <p class="hint">当前是静止中立姿态的初始估计。用地面标记核对位置，再微调；参数仅保存在此浏览器。</p>
    <div id="fields"></div>
  </section>
  <div id="error" role="alert" hidden></div>
  <div class="board" id="board" data-mode="parking">

      </div></figcaption>
      <div id="preview-frame" class="frame"><svg id="guide" class="layer" viewBox="0 0 1000 625" preserveAspectRatio="none" aria-hidden="true"></svg><span id="preview-loss" class="badge" hidden></span><span id="guide-note" class="badge bottom" hidden>静态引导线 · 距离仅示意</span></div>
